<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Search the BJJ Map — positions, techniques, and submissions.">
<meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1118" media="(prefers-color-scheme: dark)">
<title>BJJ Map — Search</title>
<script>(function(){try{var t=localStorage.getItem('bjjmap-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<link rel="icon" href="__BASE__/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="__BASE__/static/style.css">
</head><body>
<header class="site-header"><div class="wrap nav-shell">
  <a class="brand" href="__BASE__/" aria-label="BJJ Map home">
    <span class="brand-mark" aria-hidden="true"><span></span></span>
    <span class="brand-name">BJJ Map</span><span class="brand-tag">No-Gi</span>
  </a>
  <nav class="primary-nav" aria-label="Primary">
    <a class="nav-link" href="__BASE__/">Map</a>
    <a class="nav-link" href="__BASE__/graph/">Graph</a>
  </nav>
  <button class="theme-toggle" type="button" aria-label="Change color theme" title="Change color theme"><span aria-hidden="true"></span><span class="theme-label">Theme</span></button>
</div></header>
<main class="wrap page-main">
  <h1>Search the map</h1>
  <form id="search-form" class="search-form" role="search">
    <label class="sr-only" for="q">Search positions and techniques</label>
    <span class="search-icon" aria-hidden="true"></span>
    <input id="q" name="q" placeholder="Search positions, techniques…" maxlength="120" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <p id="count" class="result-count muted" aria-live="polite"></p>
  <div id="hits" class="node-grid"></div>
</main>
<script>
(function(){
var BASE = "__BASE__";
var input = document.getElementById('q');
var hits = document.getElementById('hits');
var count = document.getElementById('count');
var items = [];
function esc(s){ var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function rank(it, q){
  var name = it.name.toLowerCase();
  if (name.indexOf(q) === 0) return [0, ''];
  if (name.split(/[\s\-\(\)]+/).some(function(w){ return w.indexOf(q) === 0; })) return [1, ''];
  if (name.indexOf(q) > -1) return [2, ''];
  if ((it.aliases || []).join(' ').toLowerCase().indexOf(q) > -1) return [3, ''];
  var hit = (it.triggers || []).filter(function(t){ return t.toLowerCase().indexOf(q) > -1; })[0] || '';
  if (hit) return [4, hit];
  if ((it.description || '').toLowerCase().indexOf(q) > -1) return [5, ''];
  return [6, ''];
}
function card(it, via){
  var meta = it.side && it.side !== 'na' ? '<span>' + esc(it.side) + '</span>' : '';
  var why = via ? '<p class="muted">If they ' + esc(via) + '…</p>' : '';
  return '<article class="node-card kind-' + esc(it.kind) + '">' +
    '<span class="badge badge-' + esc(it.kind) + '">' + esc(it.kind) + '</span>' +
    '<h3><a class="card-link" href="' + BASE + '/node/' + encodeURIComponent(it.id) + '/">' + esc(it.name) + '</a></h3>' +
    '<div class="node-meta">' + meta + '</div><p>' + esc(it.description || '') + '</p>' + why + '</article>';
}
function render(){
  var raw = input.value.trim().slice(0, 120);
  var q = raw.toLowerCase();
  if (!q) { hits.innerHTML = ''; count.textContent = 'Start typing to find a position or technique.'; return; }
  var scored = [];
  items.forEach(function(it){ var r = rank(it, q); if (r[0] < 6) scored.push([r[0], r[1], it]); });
  scored.sort(function(a, b){ return a[0] - b[0] || (a[2].name < b[2].name ? -1 : 1); });
  count.textContent = scored.length ? scored.length + ' result' + (scored.length === 1 ? '' : 's') + ' for “' + raw + '”' : 'No results for “' + raw + '”';
  hits.innerHTML = scored.map(function(triple){ return card(triple[2], triple[1]); }).join('');
}
document.getElementById('search-form').addEventListener('submit', function(event){
  event.preventDefault();
  var url = new URL(location.href); url.searchParams.set('q', input.value.trim().slice(0, 120)); history.replaceState(null, '', url); render();
});
var params = new URLSearchParams(location.search);
if (params.get('q')) input.value = params.get('q').slice(0, 120);
fetch(BASE + '/api/search-index.json').then(function(r){ return r.json(); }).then(function(data){ items = data; render(); }).catch(function(){ count.textContent = 'Search could not be loaded. Try refreshing the page.'; });
input.addEventListener('input', render);
})();
</script>
<footer class="site-footer"><div class="wrap footer-shell">
  <p class="footer-note">Node descriptions are original text licensed <a href="https://creativecommons.org/licenses/by-sa/4.0/" rel="license">CC BY-SA 4.0</a>. Scoring anchors follow the IBJJF rulebook. Videos are third-party YouTube links, embedded only when you press play.</p>
  <nav class="footer-nav" aria-label="Footer">
    <a href="__BASE__/health/">Content status</a>
    <a href="https://github.com/jonathanfrei/bjjmap/issues/new/choose">Suggest an edit</a>
    <a href="https://github.com/jonathanfrei/bjjmap">Source</a>
  </nav>
</div></footer>
<script src="__BASE__/static/theme.js"></script>
</body></html>
